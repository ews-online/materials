<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>In-Class Notepad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Same visual system as the Weekly Forum (paper ground, white cards,
   stamp-red / postal-blue), with the notepad as one tall white page and a
   sticky status strip under it. */
:root{
  --paper:#EFF1EA; --card:#FFFFFF; --ink:#20261F; --ink-soft:#5B6358;
  --stamp-red:#B23A2E; --postal-blue:#3D5A73; --gold:#C9A227; --border:#D7DACE;
  --ok:#2E7D4F; --ok-bg:#EAF6EC; --warn-bg:#FBEAE7; --hint-bg:#F2F0E8; --desk:#E4E7DE;
  --radius:14px;
  --f-display:'Fraunces', Georgia, serif;
  --f-body:'IBM Plex Sans', system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;}
.hidden{display:none !important;}
.app{max-width:1100px;margin:0 auto;padding:0 16px 120px;}

header.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 0 14px;}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.3rem;letter-spacing:-0.01em;}
.brand small{display:block;font-family:var(--f-mono);font-size:0.6rem;color:var(--ink-soft);letter-spacing:0.08em;text-transform:uppercase;margin-top:2px;}
.who{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:0.74rem;color:var(--ink-soft);}
.hub-link{font-weight:600;font-size:0.86rem;font-family:var(--f-body);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:8px 14px;text-decoration:none;background:none;}
.hub-link:hover{background:#F7F8F4;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--postal-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:600;font-size:0.9rem;}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.stack{display:flex;flex-direction:column;gap:14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:11px 18px;font-family:var(--f-body);font-weight:600;font-size:0.92rem;cursor:pointer;}
.btn:focus-visible{outline:2px solid var(--postal-blue);outline-offset:2px;}
.btn:disabled{opacity:0.5;cursor:default;}
.btn-primary{background:var(--stamp-red);color:#fff;}
.btn-ghost{background:transparent;color:var(--postal-blue);border:1px solid var(--border);}

.assign-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
.eyebrow{font-family:var(--f-mono);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-soft);}
.assign-title{font-family:var(--f-display);font-weight:600;font-size:1.5rem;line-height:1.2;margin-top:4px;text-wrap:balance;overflow-wrap:anywhere;}
.session-stamp{flex-shrink:0;width:64px;height:64px;border-radius:50%;border:2px solid var(--postal-blue);color:var(--postal-blue);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(7deg);font-family:var(--f-mono);}
.session-stamp .s1{font-size:0.56rem;letter-spacing:0.06em;}
.session-stamp .s2{font-size:1.3rem;font-weight:600;line-height:1;}
.carry{font-size:0.82rem;color:var(--ink-soft);margin-top:8px;}

.prompt-card{border-left:3px solid var(--gold);}
.prompt-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;padding:0;cursor:pointer;font-family:var(--f-mono);font-size:0.68rem;color:#8a6d0c;text-transform:uppercase;letter-spacing:0.06em;}
.prompt-body{font-size:0.95rem;line-height:1.6;margin-top:8px;max-width:72ch;white-space:pre-wrap;overflow-wrap:anywhere;}

.feedback-card{border-left:3px solid var(--postal-blue);}
.feedback-card .eyebrow{color:var(--postal-blue);margin-bottom:6px;}
.feedback-card .fb-text{font-size:0.95rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-width:72ch;}

.page-wrap{background:var(--desk);border-radius:var(--radius);padding:22px clamp(10px, 3vw, 34px);}
.fmtbar{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:#F7F8F4;border:1px solid var(--border);border-bottom:none;border-radius:4px 4px 0 0;padding:6px 8px;}
.fmtbar .grp{display:flex;gap:2px;}
.fmtbar .sep{width:1px;height:22px;background:var(--border);margin:0 6px;}
.fmt{width:36px;height:34px;border:1px solid transparent;border-radius:7px;background:none;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:1rem;}
.fmt:hover{background:#ECEEE6;}
.fmt[aria-pressed="true"]{background:#E1E7EC;border-color:#C3CFD8;color:var(--postal-blue);}
.fmt:focus-visible{outline:2px solid var(--postal-blue);outline-offset:1px;}
.fmt:disabled{opacity:0.4;cursor:default;}
.fmt svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
.fmtbar .hint{margin-left:auto;font-family:var(--f-mono);font-size:0.64rem;color:var(--ink-soft);}
.notepad{display:block;width:100%;max-width:820px;margin:0 auto;min-height:62vh;background:var(--card);border:1px solid var(--border);border-radius:0 0 4px 4px;box-shadow:0 4px 18px rgba(32,38,31,0.10);
  padding:48px clamp(18px, 6vw, 64px);font-family:var(--f-body);font-size:1.05rem;line-height:1.75;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;outline:none;}
.notepad:focus{border-color:var(--postal-blue);box-shadow:0 0 0 3px rgba(61,90,115,0.14), 0 4px 18px rgba(32,38,31,0.10);}
.notepad.readonly{background:#FAFBF8;color:var(--ink-soft);border-radius:4px;user-select:none;-webkit-user-select:none;min-height:40vh;}
.notepad.locked{background:#FAFBF8;color:var(--ink-soft);}
.notepad div, .notepad p{margin:0;}
.notepad{position:relative;}
.notepad.is-empty::before{content:attr(data-placeholder);color:#9aa096;float:left;height:0;pointer-events:none;}
.compose-note{font-size:0.74rem;color:var(--ink-soft);line-height:1.6;max-width:820px;margin:12px auto 0;}
.readonly-label{max-width:820px;margin:0 auto 10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:0.72rem;color:var(--ink-soft);}

.statusbar{position:sticky;bottom:12px;margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 6px 20px rgba(32,38,31,0.12);
  padding:10px 14px;display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;z-index:5;}
.stat{display:flex;flex-direction:column;min-width:0;}
.stat .k{font-family:var(--f-mono);font-size:0.6rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);}
.stat .v{font-family:var(--f-mono);font-size:0.95rem;font-weight:500;font-variant-numeric:tabular-nums;}
.stat .v.red{color:var(--stamp-red);}
.save-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:0.74rem;padding:4px 10px;border-radius:20px;background:var(--ok-bg);color:var(--ok);}
.save-pill.saving{background:var(--hint-bg);color:var(--ink-soft);}
.save-pill.offline{background:var(--warn-bg);color:var(--stamp-red);}
.statusbar .spacer{flex:1;}
.statusbar .btns{display:flex;gap:8px;flex-wrap:wrap;}

.center-card{max-width:560px;margin:0 auto;text-align:center;padding:30px 26px;}
.big-icon{width:68px;height:68px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#fff;}
.center-card h2{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0 0 8px;text-wrap:balance;}
.center-card p{color:var(--ink-soft);line-height:1.6;margin:0 auto;max-width:46ch;font-size:0.92rem;}
.center-card p.jp{font-size:0.84rem;margin-top:6px;}
.facts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px;}
.fact{font-family:var(--f-mono);font-size:0.74rem;background:var(--hint-bg);border:1px dashed var(--border);border-radius:10px;padding:8px 12px;color:var(--ink);}
.next-open{display:inline-block;margin-top:18px;font-family:var(--f-mono);font-size:0.76rem;background:var(--warn-bg);color:var(--stamp-red);border:1px solid rgba(178,58,46,0.3);padding:6px 12px;border-radius:20px;}

.login-screen{min-height:75vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;}
.login-screen .brand{font-size:2rem;}
.login-card{width:100%;max-width:340px;text-align:left;padding:28px 24px;}
.login-card label{display:block;font-size:0.75rem;color:var(--ink-soft);font-family:var(--f-mono);letter-spacing:0.05em;text-transform:uppercase;margin:0 0 6px;}
.login-card input{width:100%;font-family:var(--f-body);font-size:1rem;padding:11px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:12px;}
.login-card input:focus{outline:none;border-color:var(--postal-blue);box-shadow:0 0 0 3px rgba(61,90,115,0.12);}
.error-msg{color:var(--stamp-red);font-size:0.82rem;margin-top:10px;}
.version-tag{font-family:var(--f-mono);font-size:0.68rem;color:var(--ink-soft);opacity:0.7;}

.modal-overlay{position:fixed;inset:0;background:rgba(32,38,31,0.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--card);border-radius:18px;padding:28px 24px;max-width:400px;width:100%;text-align:center;box-shadow:0 14px 44px rgba(32,38,31,0.35);}
.modal-box .modal-icon{font-size:2.2rem;margin-bottom:8px;}
.modal-box h3{font-family:var(--f-display);font-weight:600;font-size:1.2rem;margin:0 0 10px;}
.modal-box p{font-size:0.9rem;color:var(--ink-soft);line-height:1.55;margin:0 0 20px;}
.modal-actions{display:flex;gap:10px;}
.modal-actions .btn{flex:1;}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:0.85rem;z-index:50;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.toast.show{opacity:1;}
.loading{min-height:60vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:var(--f-mono);font-size:0.85rem;color:var(--ink-soft);}
.spinner{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--stamp-red);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){ .spinner{animation-duration:3s;} }
@media (max-width:560px){
  .assign-title{font-size:1.25rem;} .notepad{padding:28px 18px;min-height:55vh;}
  .statusbar .spacer{display:none;} .fmtbar .hint{display:none;}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar hidden" id="topbar">
    <div class="brand">In-Class Notepad<small>EWS · Writing in class</small></div>
    <div class="who"><a class="hub-link" id="hubLink" href="../student/">← Hub</a><span id="whoName"></span><div class="avatar" id="whoAvatar">?</div></div>
  </header>
  <main id="main"><div class="loading"><div class="spinner"></div>Loading…</div></main>
</div>

<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <div class="modal-icon" id="modalIcon"></div>
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div id="modalActions"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ====================================================================
   IN-CLASS NOTEPAD — student page                      v1.0 — 2026-11-02
   Talks to the Notepad Engine. Login is shared with the rest of EWS: the
   hub passes its token in the URL; this page can also sign in on its own
   through the Forum Engine (same as the forum page), including the
   ?studentNumber= auto-login used by the Moodle card.
   ==================================================================== */
const NOTEPAD_ENGINE_URL = 'https://script.google.com/macros/s/AKfycbzi2QzGBPfpGq8f-C6iy3n8vbdQ0ceM1VpZpvLhcOiuQ1I4B7ZlTD0aAgT5Xqo3FcKWpA/exec';
const FORUM_ENGINE_URL = 'https://script.google.com/macros/s/AKfycbw5J9WRH-wsUVkFLaTI18MBMnjv3K8WHdF3l7_GwtXTADyHPheHDxHt8E4sqbGxXz8M/exec';
const APP_VERSION = 'v1.0 — 2026-11-02';

const TICK_MS = 30000;          // check-in with the server while writing
const AUTOSAVE_MIN_MS = 55000;  // save at most about once a minute, only when changed
const BACKUP_DELAY_MS = 1500;   // local copy on this computer, shortly after typing stops

let me = { token: '', studentNumber: '', studentId: '', name: '', classLabel: '' };
let state = null;          // last npGetState response
let skew = 0;              // server clock minus this computer's clock
let mode = '';             // none | waiting | open | handedIn | finished | sending
let lastSavedHtml = '';
let lastSaveOkAt = 0;
let saving = false;
let closing = false;
let offline = false;
let timers = { tick: null, clock: null, backup: null, wait: null };
let stats = null;

const $ = s => document.querySelector(s);
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function serverNow(){ return Date.now() + skew; }
function noteSkew(r){ if(r && r.serverNow){ const t = new Date(r.serverNow).getTime(); if(!isNaN(t)) skew = t - Date.now(); } }
function words(t){ t = String(t || '').trim(); return t ? t.split(/\s+/).length : 0; }
function fmtClock(iso){ return new Date(iso).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', hour12:false }); }
function fmtWhen(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }) + ' · ' + fmtClock(iso);
}
function fmtLeft(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0');
}
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200); }
function store(){ try { return window.localStorage; } catch(e){ return null; } }
function lsGet(k){ try { const v = store().getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function lsSet(k, v){ try { store().setItem(k, JSON.stringify(v)); } catch(e){} }
function lsDel(k){ try { store().removeItem(k); } catch(e){} }

/* ── server calls ─────────────────────────────────────────────────── */
async function post(url, body, timeoutMs){
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), timeoutMs || 25000);
  try {
    const res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl.signal });
    return await res.json();
  } finally { clearTimeout(to); }
}
// Throws only when the server can't be reached (that's "offline");
// a server-side refusal comes back as { ok:false, error }.
function api(action, payload, timeoutMs){ return post(NOTEPAD_ENGINE_URL, Object.assign({ action, token: me.token }, payload || {}), timeoutMs); }

/* ── text: same rules as the server ───────────────────────────────── */
// Only bold, italic, underline, line/paragraph breaks and alignment survive.
const KEEP = { B:'b', STRONG:'b', I:'i', EM:'i', U:'u', DIV:'div', P:'div', BR:'br' };
function sanitize(html){
  const src = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html').body.firstChild;
  const out = document.createElement('div');
  (function walk(from, to){
    from.childNodes.forEach(n => {
      if(n.nodeType === 3){ to.appendChild(document.createTextNode(n.nodeValue)); return; }
      if(n.nodeType !== 1) return;
      if(/^(SCRIPT|STYLE|TEMPLATE|IFRAME|OBJECT|EMBED|SVG|MATH)$/.test(n.tagName)) return;
      const tag = KEEP[n.tagName];
      if(!tag){ walk(n, to); return; }
      const el = document.createElement(tag);
      const align = n.style && n.style.textAlign;
      if(tag === 'div' && /^(left|center|right)$/.test(align)) el.style.textAlign = align;
      to.appendChild(el);
      if(tag !== 'br') walk(n, el);
    });
  })(src, out);
  return out.innerHTML;
}
function htmlToText(html){
  const d = document.createElement('div');
  d.innerHTML = String(html || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/div>/gi, '\n');
  return d.textContent.replace(/ /g, ' ').split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

/* ── login ────────────────────────────────────────────────────────── */
function renderLogin(msg){
  stopAll();
  $('#topbar').classList.add('hidden');
  $('#main').innerHTML = `<div class="login-screen">
    <div class="brand">In-Class Notepad<small>EWS · Writing in class</small></div>
    <form class="card login-card" id="loginForm">
      <label for="sn">Student Number</label><input id="sn" type="text" inputmode="numeric" placeholder="e.g. 2511003" autocomplete="off" value="${esc(me.studentNumber)}">
      <div id="pwWrap" class="hidden"><label for="pw">Password</label><input id="pw" type="password" autocomplete="off"></div>
      <button class="btn btn-primary" style="width:100%" type="submit" id="loginBtn">Enter</button>
      <div class="error-msg ${msg ? '' : 'hidden'}" id="loginErr">${esc(msg || '')}</div>
    </form>
    <div class="version-tag">${APP_VERSION}</div></div>`;
  $('#loginForm').addEventListener('submit', e => { e.preventDefault(); doLogin(); });
  $('#sn').focus();
}
async function doLogin(){
  const sn = ($('#sn') ? $('#sn').value : me.studentNumber).trim();
  const pw = $('#pw') ? $('#pw').value.trim() : '';
  if(!sn) return;
  const btn = $('#loginBtn'); if(btn){ btn.disabled = true; btn.textContent = 'Checking…'; }
  let r;
  try { r = await post(FORUM_ENGINE_URL, { action:'login', studentNumber: sn, password: pw }); }
  catch(e){ return renderLogin("Couldn't reach the server — check the connection and try again."); }
  if(r.requiresPassword){
    me.studentNumber = sn; renderLogin(pw ? 'Incorrect password.' : '');
    $('#pwWrap').classList.remove('hidden'); $('#pw').focus(); return;
  }
  if(!r.ok && !r.success){ me.studentNumber = sn; return renderLogin(r.error || 'Student number not found.'); }
  me = { token: r.token, studentNumber: String(r.studentNumber || sn), studentId: r.studentId || '', name: r.nameEng || r.nameJP || sn, classLabel: r.classLabel || '' };
  try { sessionStorage.setItem('npSession', JSON.stringify(me)); } catch(e){}
  start();
}

function showTopbar(){
  $('#topbar').classList.remove('hidden');
  $('#whoName').textContent = me.name || me.studentNumber;
  $('#whoAvatar').textContent = (me.name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  $('#hubLink').href = '../student/' + (me.studentNumber ? '?studentNumber=' + encodeURIComponent(me.studentNumber) : '');
}

/* ── state ────────────────────────────────────────────────────────── */
async function start(){
  stopAll();
  let r;
  try { r = await api('npGetState'); }
  catch(e){
    $('#main').innerHTML = `<div class="card center-card" style="margin-top:30px"><h2>Can't reach the server</h2><p>Check the connection, then try again.</p><p class="jp">接続を確認して、もう一度ためしてください。</p><button class="btn btn-primary" style="margin-top:16px" onclick="start()">Try again</button></div>`;
    return;
  }
  if(r.sessionExpired){
    try { sessionStorage.removeItem('npSession'); } catch(e){}
    if(me.studentNumber && !me._retried){ me._retried = true; me.token = ''; return doLogin(); }
    return renderLogin('Please sign in again.');
  }
  if(!r.ok) return renderMessage("Something went wrong", r.error || '', true);
  me._retried = false;
  noteSkew(r);
  state = r;
  showTopbar();
  await resendLeftoverFinal();
  route();
}
function route(){
  const r = state;
  if(r.state === 'none') return renderMessage('No notepad assignment right now', 'Your teacher will open one in class.', false, '今はノートの課題がありません。');
  if(r.state === 'open') return renderWriting();
  if(r.state === 'handedIn') return renderHandedIn({ words: r.handedIn.words, wordsAtStart: r.handedIn.wordsAtStart, sessionNo: r.session.no, how: r.handedIn.how });
  if(r.state === 'finished') return renderFinished();
  return renderWaiting();
}
function stopAll(){
  Object.keys(timers).forEach(k => { clearInterval(timers[k]); clearTimeout(timers[k]); timers[k] = null; });
}

/* ── shared pieces ────────────────────────────────────────────────── */
function assignHead(sessionNo, carry){
  const a = state.assignment;
  return `<div class="card assign-head">
    <div style="min-width:0">
      <div class="eyebrow">${esc(me.classLabel || 'EWS')} · Assignment</div>
      <div class="assign-title">${esc(a.name)}</div>
      ${carry ? `<div class="carry">${carry}</div>` : ''}
    </div>
    ${sessionNo ? `<div class="session-stamp" aria-label="Session ${sessionNo}"><span class="s1">SESSION</span><span class="s2">${String(sessionNo).padStart(2,'0')}</span></div>` : ''}
  </div>`;
}
function feedbackCard(){
  const f = state.feedback;
  if(!f) return '';
  return `<div class="card feedback-card"><div class="eyebrow">Teacher feedback · 先生からのコメント</div><div class="fb-text">${esc(f.text)}</div></div>`;
}
function promptCard(open){
  const ins = state.assignment.instructions;
  if(!ins || !ins.trim()) return '';
  return `<div class="card prompt-card">
    <button class="prompt-toggle" id="promptToggle" aria-expanded="${open}" aria-controls="promptBody"><span>Instructions</span><span>${open ? 'Hide ⌃' : 'Show ⌄'}</span></button>
    <div class="prompt-body" id="promptBody" ${open ? '' : 'hidden'}>${esc(ins)}</div></div>`;
}
function wirePrompt(){
  const t = $('#promptToggle'); if(!t) return;
  t.addEventListener('click', () => {
    const b = $('#promptBody'), open = b.hidden;
    b.hidden = !open; t.setAttribute('aria-expanded', open);
    t.lastElementChild.textContent = open ? 'Hide ⌃' : 'Show ⌄';
  });
}
function readOnlyDraft(label){
  if(!state.draft) return '';
  return `<div class="page-wrap">
    <div class="readonly-label"><span>READ ONLY — you can look, but not edit or copy</span><span>${esc(label)}</span></div>
    <div class="notepad readonly" id="roPad" role="document" aria-label="Your draft (read only)"></div></div>`;
}
function fillReadOnly(){
  const el = $('#roPad'); if(!el) return;
  el.innerHTML = sanitize(state.draft.html) || '<span style="color:#9aa096">(empty)</span>';
  ['copy','cut','contextmenu','dragstart','selectstart'].forEach(ev => el.addEventListener(ev, e => e.preventDefault()));
}
function nextOpenPill(){
  const n = state.nextSession;
  return n ? `<span class="next-open">Opens ${esc(fmtWhen(n.openAt))}</span>` : `<span class="next-open">Your teacher will open the next session in class</span>`;
}
function renderMessage(title, text, retry, jp){
  stopAll(); mode = 'none';
  $('#main').innerHTML = `<div class="card center-card" style="margin-top:30px">
    <div class="big-icon" style="background:var(--postal-blue)">✎</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${jp ? `<p class="jp">${esc(jp)}</p>` : ''}
    ${retry ? '<button class="btn btn-primary" style="margin-top:16px" onclick="start()">Try again</button>' : ''}</div>`;
  if(state && state.state === 'none') pollWhileWaiting(120000);
}

/* ── waiting / handed in / finished ───────────────────────────────── */
function renderWaiting(){
  stopAll(); mode = 'waiting';
  const r = state, last = r.lastSession;
  const done = r.sessionsDone;
  let body;
  if(last && last.how !== 'server'){
    body = handedInCard(last.words, last.wordsAtStart, last.no, last.how);
  } else {
    body = `<div class="card center-card">
      <div class="big-icon" style="background:var(--postal-blue)">✎</div>
      <h2>Your notepad is with your teacher</h2>
      <p>${done ? "You'll get it back at the start of the next writing session, exactly where you left off." : 'The first writing session has not started yet.'}</p>
      <p class="jp">${done ? 'ノートは先生が預かっています。次の授業で、前回の続きから書けます。' : '最初の授業はまだ始まっていません。'}</p>
      ${nextOpenPill()}</div>`;
  }
  $('#main').innerHTML = `<div class="stack">${assignHead(null, done ? done + ' session' + (done === 1 ? '' : 's') + ' done · ' + r.lastWords + ' words so far' : '')}
    ${feedbackCard()}${body}${readOnlyDraft(r.lastWords + ' words')}</div>`;
  fillReadOnly();
  pollWhileWaiting();
}
function handedInCard(w, w0, no, how){
  const added = Math.max(0, w - (w0 || 0));
  return `<div class="card center-card">
    <div class="big-icon" style="background:var(--ok)">✓</div>
    <h2>Saved and handed in</h2>
    <p>Your writing for this session is saved. The notepad is closed until the next session.</p>
    <p class="jp">保存しました。次の授業まで、ノートは閉じられます。</p>
    ${how === 'late' ? '<p style="margin-top:8px">Your computer was offline at the end, so it was sent a little late — your teacher can see that.</p>' : ''}
    <div class="facts"><span class="fact">Session ${no}</span><span class="fact">${w} words</span><span class="fact">+${added} this session</span></div>
    ${nextOpenPill()}</div>`;
}
function renderHandedIn(info){
  stopAll(); mode = 'handedIn';
  $('#main').innerHTML = `<div class="stack">${assignHead(info.sessionNo)}${feedbackCard()}${handedInCard(info.words, info.wordsAtStart, info.sessionNo, info.how)}</div>`;
  pollWhileWaiting(120000);
}
function renderFinished(){
  stopAll(); mode = 'finished';
  const r = state;
  $('#main').innerHTML = `<div class="stack">${assignHead(null, 'Finished · ' + r.lastWords + ' words')}
    ${feedbackCard()}
    <div class="card center-card"><div class="big-icon" style="background:var(--ok)">✓</div><h2>This assignment is finished</h2>
      <p>${r.feedback ? 'Read your teacher\'s feedback above.' : 'Your teacher has your final draft.'}</p><p class="jp">この課題は終わりました。</p></div>
    ${readOnlyDraft('Final draft · ' + r.lastWords + ' words')}</div>`;
  fillReadOnly();
}
// While the notepad is closed, check every 30 s (only while this tab is
// visible) so the page opens by itself when the teacher starts a session.
function pollWhileWaiting(slowMs){
  clearTimeout(timers.wait);
  const n = state && state.nextSession;
  let delay = slowMs || 30000;
  if(n && new Date(n.openAt).getTime() - serverNow() > 60 * 60 * 1000) delay = 5 * 60 * 1000;
  timers.wait = setTimeout(async function check(){
    if(document.hidden){ timers.wait = setTimeout(check, 10000); return; }
    try {
      const r = await api('npGetState');
      if(r.ok){
        noteSkew(r);
        const changed = r.state !== state.state || JSON.stringify(r.nextSession) !== JSON.stringify(state.nextSession) || JSON.stringify(r.feedback) !== JSON.stringify(state.feedback);
        state = r;
        if(changed){ route(); return; }
      } else if(r.sessionExpired){ return start(); }
    } catch(e){}
    pollWhileWaiting(slowMs);
  }, delay + Math.floor(Math.random() * 5000));
}

/* ── writing ──────────────────────────────────────────────────────── */
function backupKey(){ return 'np_backup_' + state.assignment.id + '_' + me.studentNumber; }
function statsKey(){ return 'np_stats_' + state.session.id + '_' + me.studentNumber; }
function newStats(){ return { activeSec:0, charsTyped:0, revisions:0, deletions:0, moves:0, blockedPastes:0, tabAways:0, tabAwaySec:0 }; }
function statsOut(){ const o = {}; Object.keys(stats).forEach(k => { if(k[0] !== '_') o[k] = Math.round(stats[k]); }); return o; }
function persistStats(){ lsSet(statsKey(), statsOut()); }

function renderWriting(){
  stopAll(); mode = 'open'; closing = false; offline = false;
  const r = state, s = r.session;
  const pad = sanitize(r.draft.html);
  const carry = s.no > 1 || r.wordsAtStart > 0
    ? `Continuing from Session ${s.no - 1 || 1} · ${r.wordsAtStart} words so far`
    : 'First session — start writing below';
  // Writing-process counts survive a reload (and a change of computer).
  stats = newStats();
  const local = lsGet(statsKey()) || {};
  Object.keys(stats).forEach(k => { stats[k] = Math.max(Number(local[k]) || 0, Number((r.stats || {})[k]) || 0); });

  $('#main').innerHTML = `<div class="stack">
    ${assignHead(s.no, carry)}
    ${feedbackCard()}
    ${promptCard(s.no === 1 && !r.wordsAtStart)}
    <div class="page-wrap">
      <div class="fmtbar" role="toolbar" aria-label="Formatting">
        <div class="grp">
          <button class="fmt" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="false"><b>B</b></button>
          <button class="fmt" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false"><i>I</i></button>
          <button class="fmt" data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline" aria-pressed="false"><u>U</u></button>
        </div>
        <span class="sep" aria-hidden="true"></span>
        <div class="grp">
          <button class="fmt" data-cmd="justifyLeft" title="Align left" aria-label="Align left" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
          <button class="fmt" data-cmd="justifyCenter" title="Centre" aria-label="Centre" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
          <button class="fmt" data-cmd="justifyRight" title="Align right" aria-label="Align right" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
        </div>
        <span class="hint">Ctrl+B · Ctrl+I · Ctrl+U · Ctrl+Z undo</span>
      </div>
      <div class="notepad" id="pad" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off" translate="no"
        role="textbox" aria-multiline="true" aria-label="Your writing" data-placeholder="Type your title on the first line, then start writing…"></div>
      <div class="compose-note">※ 自分の文章の中での切り取り・コピー・貼り付けはできますが、外からの貼り付けはできません。<br>※ 書き方（書いた時間・直した回数など）は記録されます。他のウィンドウやタブに移ると記録されます。</div>
    </div>
    <div class="statusbar">
      <div class="stat"><span class="k">Words</span><span class="v" id="wc">0</span></div>
      <div class="stat"><span class="k">Time left</span><span class="v" id="tl">—</span></div>
      <span class="save-pill" id="savePill">✓ Opened ${esc(fmtClock(new Date(serverNow()).toISOString()))}</span>
      <span class="spacer"></span>
      <div class="btns">
        <button class="btn btn-ghost" id="saveBtn">Save</button>
        <button class="btn btn-primary" id="leaveBtn">Save &amp; leave</button>
      </div>
    </div></div>`;
  wirePrompt();
  const el = $('#pad');
  // Writing always lives inside paragraph blocks; without one, Chrome copies
  // the page's own font size into the text the first time a line is centred.
  el.innerHTML = pad || '<div><br></div>';
  lastSavedHtml = el.innerHTML;   // compare the page with itself, never with a re-serialized copy
  lastSaveOkAt = Date.now();
  try { document.execCommand('defaultParagraphSeparator', false, 'div'); document.execCommand('styleWithCSS', false, false); } catch(e){}

  // A newer copy on this computer than on the server (the connection
  // dropped, or the page was closed before it could save): use it.
  const b = lsGet(backupKey());
  if(b && !b.final && b.sessionId === s.id && sanitize(b.html) !== pad && b.at > new Date(r.draft.updatedAt || 0).getTime()){
    el.innerHTML = sanitize(b.html);
    toast('Restored your latest writing from this computer.');
  }
  updateWordCount();
  wireEditor(el);
  wireToolbar(el);
  $('#saveBtn').addEventListener('click', () => saveNow(true));
  $('#leaveBtn').addEventListener('click', confirmLeave);
  timers.clock = setInterval(clockTick, 1000);
  clockTick();
  scheduleTick();
  if(el.innerHTML !== lastSavedHtml) saveNow(false);
  el.focus();
  placeCaretAtEnd(el);
}
function placeCaretAtEnd(el){
  try { const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch(e){}
}
function padHtml(){ const el = $('#pad'); return el ? el.innerHTML : lastSavedHtml; }
function isDirty(){ return padHtml() !== lastSavedHtml; }
function updateWordCount(){
  const el = $('#pad'); if(!el) return;
  const n = words(htmlToText(el.innerHTML));
  el.classList.toggle('is-empty', !el.textContent.trim() && !el.querySelector('br + *'));
  if(!el.firstChild) el.innerHTML = '<div><br></div>';
  const t = state.assignment.targetWords;
  $('#wc').textContent = t ? n + ' / ' + t : n;
}
function setPill(cls, text){ const p = $('#savePill'); if(!p) return; p.className = 'save-pill ' + (cls || ''); p.textContent = text; }

function clockTick(){
  const close = new Date(state.session.closeAt).getTime();
  const left = (close - serverNow()) / 1000;
  const el = $('#tl');
  if(el){
    el.textContent = fmtLeft(left);
    el.classList.toggle('red', left <= 300);
  }
  if(left <= 300 && left > 297 && !state._warned5){ state._warned5 = true; toast('5 minutes left — your work saves automatically at the end.'); }
  if(left <= 0) closeNotepad('auto');
}
function scheduleTick(){
  clearTimeout(timers.tick);
  timers.tick = setTimeout(async () => {
    if(mode !== 'open' || closing) return;
    if(isDirty() && (Date.now() - lastSaveOkAt >= AUTOSAVE_MIN_MS || offline)) await saveNow(false);
    else await ping();
    scheduleTick();
  }, TICK_MS + Math.floor(Math.random() * 4000));
}
function applySessionUpdate(s){
  if(!s) return;
  const before = state.session.closeAt;
  state.session = Object.assign(state.session, s);
  if(before !== s.closeAt && s.state === 'open'){
    const diff = Math.round((new Date(s.closeAt) - new Date(before)) / 60000);
    if(diff > 0) toast('Your teacher added ' + diff + ' minute' + (diff === 1 ? '' : 's') + '. Ends at ' + fmtClock(s.closeAt) + '.');
  }
}
async function ping(){
  try {
    const r = await api('npPing', { sessionId: state.session.id, words: words(htmlToText(padHtml())), stats: JSON.stringify(statsOut()) }, 15000);
    if(r.sessionExpired) return;
    noteSkew(r);
    if(offline){ offline = false; setPill('', '✓ Back online'); }
    if(r.closed){ if(r.session) applySessionUpdate(r.session); closeNotepad('auto'); return; }
    applySessionUpdate(r.session);
  } catch(e){ goOffline(); }
}
function goOffline(){
  offline = true;
  setPill('offline', '⚠ Not sent — saved on this computer');
  writeBackup();
}
function writeBackup(final){
  if(!state || !state.session) return;
  lsSet(backupKey(), { sessionId: state.session.id, html: padHtml(), at: Date.now(), final: final || '' , stats: statsOut() });
}
function clearBackupIfSent(raw){
  const b = lsGet(backupKey());
  if(b && !b.final && b.html === raw) lsDel(backupKey());
}

async function saveNow(manual, final){
  if(saving){ if(manual) toast('Saving…'); return null; }
  saving = true;
  const raw = padHtml();
  const html = sanitize(raw);
  setPill('saving', 'Saving…');
  try {
    const r = await api('npSave', { assignmentId: state.assignment.id, sessionId: state.session.id, html, final: final || '', manual: !!manual, stats: JSON.stringify(statsOut()) });
    noteSkew(r);
    if(r.ok){
      lastSavedHtml = raw;           // anything typed while this was sending stays "not saved"
      lastSaveOkAt = Date.now();
      offline = false;
      clearBackupIfSent(raw);
      persistStats();
      if(r.session) applySessionUpdate(r.session);
      setPill('', '✓ Saved ' + fmtClock(new Date().toISOString()));
      if(r.handedIn && !final){ closeNotepad('auto', r); } // the bell rang while this save was on its way
      return r;
    }
    if(r.handedIn || r.closed){ return r; }
    if(r.sessionExpired){ setPill('offline', '⚠ Signed out — tell your teacher'); writeBackup(); return r; }
    setPill('offline', '⚠ Not saved — ' + (r.error || 'try again'));
    writeBackup();
    return r;
  } catch(e){
    goOffline();
    return null;
  } finally { saving = false; }
}

/* ── closing: Save & leave, or the close time ─────────────────────── */
function confirmLeave(){
  showModal('📄', 'Hand in for today?', "Your writing will be saved and the notepad will close. You can't open it again until the next session. / 保存して提出します。次の授業まで開けません。",
    [{ label:'Keep writing', cls:'btn-ghost', fn: closeModal }, { label:'Save & leave', cls:'btn-primary', fn: () => { closeModal(); closeNotepad('leave'); } }]);
}
// Locks the page first, then sends. Nothing typed after this moment can get in.
async function closeNotepad(how, alreadySaved){
  if(closing) return;
  closing = true;
  clearTimeout(timers.tick);
  clearInterval(timers.clock);
  const el = $('#pad');
  if(el){ el.contentEditable = 'false'; el.classList.add('locked'); el.blur(); }
  document.querySelectorAll('.fmt, #saveBtn, #leaveBtn').forEach(b => b.disabled = true);
  if($('#tl')) $('#tl').textContent = '0:00';
  closeModal();
  writeBackup(how);
  if(alreadySaved) return finishClose(alreadySaved);
  while(saving) await new Promise(res => setTimeout(res, 200));
  setPill('saving', how === 'leave' ? 'Handing in…' : "Time's up — saving…");
  // At the bell the whole class closes at once: spread the closing saves
  // over a few seconds (the page is already locked, so nothing changes).
  if(how === 'auto') await new Promise(res => setTimeout(res, Math.floor(Math.random() * 4000)));
  sendFinal(how, 0);
}
async function sendFinal(how, attempt){
  setPill('saving', how === 'leave' ? 'Handing in…' : "Time's up — saving…");
  const b = lsGet(backupKey());
  const html = sanitize(b && b.sessionId === state.session.id ? b.html : padHtml());
  let r = null;
  try {
    r = await api('npSave', { assignmentId: state.assignment.id, sessionId: state.session.id, html, final: how, stats: JSON.stringify(statsOut()) });
  } catch(e){ r = null; }
  if(r && r.ok){ lsDel(backupKey()); persistStats(); return finishClose(r); }
  if(r && r.handedIn){ lsDel(backupKey()); return finishClose({ words: words(htmlToText(html)), wordsAtStart: state.wordsAtStart, how: how }); }
  if(r && r.closed){ return renderSendFailed(r.error); }
  // Server busy (everyone saving at once): try again quietly a few times.
  if(r && r.busy && attempt < 4){ timers.tick = setTimeout(() => sendFinal(how, attempt + 1), 2000 + Math.floor(Math.random() * 3000)); return; }
  // Offline: keep trying, the work is safe on this computer.
  renderSending(attempt);
  timers.tick = setTimeout(() => sendFinal(how, attempt + 1), Math.min(10000 + attempt * 2000, 30000));
}
function finishClose(r){
  stopAll();
  state.state = 'handedIn';
  renderHandedIn({ words: r.words, wordsAtStart: r.wordsAtStart != null ? r.wordsAtStart : state.wordsAtStart, sessionNo: state.session.no, how: r.how });
}
function renderSending(attempt){
  mode = 'sending';
  if($('#sendingCard')) { $('#sendTries').textContent = attempt + 1; return; }
  const box = document.createElement('div');
  box.className = 'card center-card'; box.id = 'sendingCard';
  box.innerHTML = `<div class="big-icon" style="background:var(--gold)">⟳</div><h2>Saving your writing…</h2>
    <p>The connection dropped. Your writing is safe on this computer and will be sent as soon as the connection is back. Please keep this page open and tell your teacher.</p>
    <p class="jp">接続が切れました。文章はこのパソコンに保存されています。接続が戻ると自動で送信されます。このページを閉じないで、先生に知らせてください。</p>
    <div class="facts"><span class="fact">Attempt <span id="sendTries">${attempt + 1}</span></span></div>`;
  $('#main').prepend(box);
  window.scrollTo(0, 0);
}
function renderSendFailed(msg){
  stopAll();
  const box = document.createElement('div');
  box.className = 'card center-card';
  box.innerHTML = `<div class="big-icon" style="background:var(--stamp-red)">!</div><h2>Your last changes could not be sent</h2>
    <p>${esc(msg || 'The session has closed.')} Please show this screen to your teacher.</p><p class="jp">この画面を先生に見せてください。</p>`;
  const old = $('#sendingCard'); if(old) old.remove();
  $('#main').prepend(box);
}
// A final save left over from last time (the page was closed while offline):
// send it now. The server decides whether it is still in time.
async function resendLeftoverFinal(){
  if(!state.assignment) return;
  const b = lsGet('np_backup_' + state.assignment.id + '_' + me.studentNumber);
  if(!b || !b.final) return;
  try {
    const r = await api('npSave', { assignmentId: state.assignment.id, sessionId: b.sessionId, html: sanitize(b.html), final: b.final, stats: JSON.stringify(b.stats || {}) });
    if(r.ok || r.handedIn || r.closed){
      lsDel('np_backup_' + state.assignment.id + '_' + me.studentNumber);
      if(r.ok){ const fresh = await api('npGetState'); if(fresh.ok) state = fresh; }
    }
  } catch(e){}
}

/* ── editor: formatting, own-text-only paste, writing counts ──────── */
function wireToolbar(pad){
  const btns = [...document.querySelectorAll('.fmt')];
  btns.forEach(b => {
    b.addEventListener('mousedown', e => e.preventDefault()); // keep the selection
    b.addEventListener('click', () => { if(closing) return; pad.focus(); document.execCommand(b.dataset.cmd, false, null); pad.dispatchEvent(new Event('input')); refresh(); });
  });
  function refresh(){
    const sel = getSelection();
    if(!sel.anchorNode || !pad.contains(sel.anchorNode)) return;
    btns.forEach(b => { let on = false; try { on = document.queryCommandState(b.dataset.cmd); } catch(e){} b.setAttribute('aria-pressed', on); });
  }
  document.addEventListener('selectionchange', refresh);
}
function caretOffset(pad){
  try {
    const sel = getSelection(); if(!sel.rangeCount) return 0;
    const r = sel.getRangeAt(0).cloneRange(); r.selectNodeContents(pad); r.setEnd(sel.getRangeAt(0).startContainer, sel.getRangeAt(0).startOffset);
    return r.toString().length;
  } catch(e){ return 0; }
}
function caretAtEnd(pad){
  try {
    const sel = getSelection(); if(!sel.rangeCount) return true;
    const r = sel.getRangeAt(0).cloneRange(); r.selectNodeContents(pad); r.setStart(sel.getRangeAt(0).endContainer, sel.getRangeAt(0).endOffset);
    return r.toString().trim() === '';
  } catch(e){ return true; }
}
function noteRevision(pos){
  const now = Date.now();
  const same = stats._lastWasInText && now - stats._lastEditAt < 4000 && stats._lastEditPos != null && Math.abs(pos - stats._lastEditPos) <= 25;
  if(!same) stats.revisions++;
  stats._lastWasInText = true; stats._lastEditAt = now; stats._lastEditPos = pos;
}
function blockedPaste(){
  stats.blockedPastes++; persistStats();
  showModal('🚫', "Pasting from outside isn't allowed", "You can cut, copy and paste your own writing inside the notepad, but text from other places can't be pasted. / 自分の文章の中での貼り付けはできますが、外からの貼り付けはできません。", [{ label:'OK', cls:'btn-primary', fn: closeModal }]);
}
function wireEditor(pad){
  let clip = null, drag = null, lastInputAt = 0;
  const norm = s => String(s || '').replace(/\r\n?/g, '\n').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  const selText = () => norm(getSelection().toString());
  const remember = () => { const s = selText(); if(s) clip = s; };
  pad.addEventListener('copy', remember);
  pad.addEventListener('cut', remember);
  pad.addEventListener('dragstart', () => { drag = selText() || null; });
  pad.addEventListener('dragend', () => { drag = null; });
  // Only text copied or cut inside this notepad can be pasted back in.
  pad.addEventListener('paste', e => {
    e.preventDefault();
    if(closing) return;
    const cd = e.clipboardData;
    const t = norm(cd ? cd.getData('text/plain') : '');
    if(!t || clip === null || t !== clip){ blockedPaste(); return; }
    const html = cd.getData('text/html');
    stats.moves++; noteRevision(caretOffset(pad));
    document.execCommand('insertHTML', false, html ? sanitize(html) : esc(cd.getData('text/plain')).replace(/\n/g, '<br>'));
  });
  pad.addEventListener('drop', e => {
    const t = norm(e.dataTransfer ? e.dataTransfer.getData('text/plain') : '');
    if(t && drag !== null && t === drag && !(e.dataTransfer.files && e.dataTransfer.files.length)){
      drag = null; stats.moves++;
      setTimeout(() => { pad.innerHTML = sanitize(pad.innerHTML); pad.dispatchEvent(new Event('input')); }, 0);
      return;
    }
    e.preventDefault(); blockedPaste();
  });
  pad.addEventListener('dragover', e => { if(drag === null) e.preventDefault(); });
  pad.addEventListener('beforeinput', e => {
    if(closing){ e.preventDefault(); return; }
    const type = e.inputType || '';
    // Text arriving in one big piece is not typing (an extension, a
    // text expander, dictation of a whole paragraph…): blocked like a paste.
    if((type === 'insertText' || type === 'insertReplacementText') && e.data && e.data.length > 40){ e.preventDefault(); blockedPaste(); return; }
    if(type === 'insertReplacementText' || type === 'insertFromYank' || type === 'insertLink'){ e.preventDefault(); return; }
    if(type === 'insertFromPaste' || type === 'insertFromDrop' || type === 'deleteByDrag' || type === 'insertCompositionText') return;
    const atEnd = caretAtEnd(pad);
    if(type.indexOf('delete') === 0){
      stats.deletions++;
      if(atEnd) stats._lastWasInText = false; else noteRevision(caretOffset(pad));
    } else if(type.indexOf('insert') === 0){
      if(type === 'insertText' && e.data) stats.charsTyped += e.data.length;
      else if(type === 'insertParagraph' || type === 'insertLineBreak') stats.charsTyped += 1;
      if(atEnd) stats._lastWasInText = false; else noteRevision(caretOffset(pad));
    }
  });
  pad.addEventListener('compositionend', e => { if(e.data) stats.charsTyped += e.data.length; });
  pad.addEventListener('input', () => {
    const now = Date.now();
    if(lastInputAt && now - lastInputAt < 60000) stats.activeSec += (now - lastInputAt) / 1000;
    lastInputAt = now;
    updateWordCount();
    clearTimeout(timers.backup);
    timers.backup = setTimeout(() => { writeBackup(); persistStats(); }, BACKUP_DELAY_MS);
    if(!offline && !saving) setPill('saving', 'Not saved yet');
    if(offline) setPill('offline', '⚠ Not sent — saved on this computer');
  });
}

/* ── leaving the page while writing ───────────────────────────────── */
let awaySince = null;
function markAway(){ if(mode === 'open' && !closing && !awaySince) awaySince = Date.now(); }
function markBack(){
  if(!awaySince) return;
  const away = Date.now() - awaySince; awaySince = null;
  if(mode !== 'open' || closing || away <= 1500) return;
  stats.tabAways++; stats.tabAwaySec += away / 1000; persistStats();
  showModal('⚠️', 'Stay on this page', "You switched away while writing. Using translation tools or other apps isn't allowed, and this has been recorded. / 書いている途中で他の画面に移りました。翻訳ツールや他のアプリは使えません。記録されました。", [{ label:'OK', cls:'btn-primary', fn: closeModal }]);
}
window.addEventListener('blur', markAway);
window.addEventListener('focus', markBack);
document.addEventListener('visibilitychange', () => { if(document.hidden) markAway(); else markBack(); });
window.addEventListener('pagehide', () => { if(mode === 'open' && !closing) writeBackup(); });
window.addEventListener('beforeunload', e => {
  if(mode === 'open' && !closing && isDirty()){ writeBackup(); e.preventDefault(); e.returnValue = ''; }
});
window.addEventListener('online', () => { if(mode === 'open' && offline && !closing) saveNow(false); });

/* ── modal ────────────────────────────────────────────────────────── */
function showModal(icon, title, text, actions){
  $('#modalIcon').textContent = icon; $('#modalTitle').textContent = title; $('#modalText').textContent = text;
  const box = $('#modalActions'); box.innerHTML = ''; box.className = actions.length > 1 ? 'modal-actions' : '';
  actions.forEach(a => { const b = document.createElement('button'); b.className = 'btn ' + a.cls; if(actions.length === 1) b.style.width = '100%'; b.textContent = a.label; b.onclick = a.fn; box.appendChild(b); });
  $('#modal').classList.add('show');
  box.lastChild.focus();
}
function closeModal(){
  $('#modal').classList.remove('show');
  const p = $('#pad'); if(p && mode === 'open' && !closing) p.focus();
}
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('#modal').classList.contains('show') && $('#modalActions').children.length === 1) closeModal(); });

/* ── boot: hub token, saved session, ?studentNumber= or sign-in ───── */
(function boot(){
  const q = new URLSearchParams(location.search);
  let saved = null;
  try { saved = JSON.parse(sessionStorage.getItem('npSession') || 'null'); } catch(e){}
  let hub = null;
  try { hub = JSON.parse(sessionStorage.getItem('ewsHubSession') || 'null'); } catch(e){}
  if(q.get('token')){
    me = { token: q.get('token'), studentNumber: q.get('studentNumber') || '', studentId: '', name: q.get('nameEng') || q.get('nameJP') || '', classLabel: q.get('classLabel') || '' };
    try { sessionStorage.setItem('npSession', JSON.stringify(me)); } catch(e){}
    // Keep the token out of the address bar (it would end up in bookmarks).
    try { history.replaceState(null, '', location.pathname); } catch(e){}
    return start();
  }
  if(saved && saved.token){ me = saved; return start(); }
  if(hub && hub.token){ me = { token: hub.token, studentNumber: String(hub.studentNumber || ''), name: hub.nameEng || hub.nameJP || '', classLabel: hub.classLabel || '' }; return start(); }
  if(q.get('studentNumber')){ me.studentNumber = q.get('studentNumber'); return doLogin(); }
  renderLogin();
})();
</script>
